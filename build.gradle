plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    // used to relocate one loader's copy of the shared classes for the universal jar
    id 'com.gradleup.shadow' version '8.3.5' apply false
}

evaluationDependsOn(':common')
evaluationDependsOn(':fabric')
evaluationDependsOn(':neoforge')
evaluationDependsOn(':universal')

tasks.register('buildAll') {
    group = 'build'
    dependsOn subprojects.collect { it.tasks.named('build') }
}
